name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. Path Filter for CD
  # ============================================================================
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.filter.outputs.publish }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            publish:
              - 'src/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'Dockerfile'
              - 'compose.yml'
              - '.dockerignore'
              - '.github/workflows/cd.yml'

  # ============================================================================
  # 2. Build and Publish Multi-Arch Docker Image
  # ============================================================================
  publish:
    name: Build & Push Container Image
    needs: changes
    if: ${{ needs.changes.outputs.should_publish == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/neuralwire-media/og
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-

      - name: Build & Push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Automated Deployment to VPS via SSH
  # ============================================================================
  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "==> Deploying Neuralwire OG microservice on VPS..."
            
            if [ -d "/home/ubuntu/nw/og" ]; then
              echo "==> Found project directory at /home/ubuntu/nw/og"
              cd /home/ubuntu/nw/og
              git pull origin main || true
              docker compose down || true
              docker compose pull || docker pull ghcr.io/neuralwire-media/og:latest
              docker compose up -d --build --remove-orphans
            else
              echo "==> Standalone container deployment mode..."
              docker pull ghcr.io/neuralwire-media/og:latest
              docker stop neuralwire-og 2>/dev/null || true
              docker rm neuralwire-og 2>/dev/null || true
              docker run -d \
                --name neuralwire-og \
                --restart unless-stopped \
                -p 3000:3000 \
                ghcr.io/neuralwire-media/og:latest
            fi

            echo "==> Pruning unused dangling images..."
            docker image prune -f

            echo "==> Validating microservice health..."
            sleep 4
            curl -f --retry 3 --retry-delay 2 http://localhost:3000/api/health || exit 1
            echo "==> Neuralwire OG microservice successfully deployed & operational!"

